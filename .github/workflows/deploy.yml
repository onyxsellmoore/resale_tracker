name: Deploy — Push to Main

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: resale-tracker-pr
  GCP_REGION: us-central1
  AR_REPO: us-central1-docker.pkg.dev/resale-tracker-pr/booking
  SERVICE_NAME: booking-api
  WIF_PROVIDER: projects/742727911661/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  WIF_SA: gh-action-deployer@resale-tracker-pr.iam.gserviceaccount.com

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        working-directory: booking-api
        run: ./mvnw -B verify

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking-ui/package-lock.json

      - name: Install and test
        working-directory: booking-ui
        run: |
          npm ci
          npx tsc -b --noEmit
          npm test -- --run

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking-ui/package-lock.json

      - name: OWASP Dependency Check
        working-directory: booking-api
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DsuppressionFiles=../.github/owasp-suppressions.xml "-DnvdApiKey=${NVD_API_KEY}"

      - name: npm audit
        working-directory: booking-ui
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  deploy-backend:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build JAR
        working-directory: booking-api
        run: ./mvnw -B package -DskipTests

      - name: Build and push Docker image
        working-directory: booking-api
        run: |
          IMAGE=${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker buildx build --platform linux/amd64 \
            -f src/main/docker/Dockerfile.jvm \
            -t $IMAGE -t ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest .
          docker push $IMAGE
          docker push ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --update-secrets=QUARKUS_MONGODB_CONNECTION_STRING=mongo-uri:latest,BOOKING_JWT_SECRET=jwt-secret:latest,BOOKING_WEBAUTHN_RP_ID=webauthn-rp-id:latest,BOOKING_WEBAUTHN_ORIGIN=webauthn-origin:latest,CORS_ORIGINS=cors-origins:latest \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --port=8080 \
            --quiet

  deploy-frontend:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: booking-ui/package-lock.json

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install and build
        working-directory: booking-ui
        run: |
          npm ci
          cp .env.production.example .env.production
          npm run build

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ env.GCP_PROJECT }} --non-interactive
