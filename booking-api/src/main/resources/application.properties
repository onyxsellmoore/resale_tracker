# MongoDB connection
quarkus.mongodb.connection-string=${MONGO_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=SalesTracker

# Disable DevServices in production (we use docker-compose for MongoDB)
quarkus.devservices.enabled=false

# Enable DevServices for tests (embedded MongoDB via test containers)
%test.quarkus.devservices.enabled=true

# Health check reports UP even without DB for now
quarkus.mongodb.health.enabled=false

# Disable index creation during tests (embedded MongoDB starts after app)
%test.booking.indexes.enabled=false

# Security
booking.security.enabled=true
%test.booking.security.enabled=false
booking.jwt.secret=${JWT_SECRET:change-me-in-production-use-a-256-bit-random-string-here}
booking.jwt.expiry-minutes=15

# WebAuthn
booking.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
booking.webauthn.rp-name=${WEBAUTHN_RP_NAME:Inventory Ledger}
booking.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}
booking.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5173,https://localhost}
%test.booking.webauthn.origin=http://localhost:8081
%test.booking.webauthn.allowed-origins=http://localhost:8081,https://localhost

# Dev token endpoint (for black-box testing — disabled by default)
booking.dev-token.enabled=false
%dev.booking.dev-token.enabled=true
%test.booking.dev-token.enabled=true

# CORS
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Disable Quarkus built-in OIDC/JWT (we use custom filter)
quarkus.http.auth.proactive=false
